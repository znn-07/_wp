<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💻 ZN 作業統整平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 0.6s ease;
            background: linear-gradient(135deg, #2c3e50, #3498db);
            padding: 40px 20px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(44, 62, 80, 0.25);
        }

        header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            font-weight: 700;
            color: white;
            text-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        header p {
            font-size: 1.1em;
            color: rgba(255,255,255,0.85);
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .stat-box {
            background: white;
            padding: 20px 35px;
            border-radius: 14px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            text-align: center;
            animation: slideUp 0.6s ease;
            flex: 1;
            min-width: 160px;
            max-width: 220px;
            border-top: 4px solid #34495e;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .stat-box:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        }

        .stat-box h3 {
            color: #2c3e50;
            font-size: 2.2em;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .stat-box p {
            color: #7f8c8d;
            font-size: 0.9em;
            font-weight: 500;
        }

        .search-box {
            margin-bottom: 25px;
            animation: fadeInUp 0.6s ease;
        }

        .search-box input {
            width: 100%;
            padding: 16px 20px;
            font-size: 1em;
            border: none;
            border-radius: 12px;
            background: white;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            outline: none;
            box-shadow: 0 4px 20px rgba(52, 73, 94, 0.2);
        }

        .filter-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .filter-btn {
            padding: 10px 22px;
            border: none;
            background: white;
            color: #7f8c8d;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.95em;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .filter-btn:hover {
            background: #34495e;
            color: white;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(52, 73, 94, 0.25);
        }

        .filter-btn.active {
            background: #34495e;
            color: white;
            box-shadow: 0 4px 12px rgba(52, 73, 94, 0.3);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
            margin-bottom: 40px;
        }

        .card {
            background: white;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            transition: all 0.35s ease;
            animation: fadeIn 0.6s ease;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12);
        }

        .card-header {
            padding: 20px 22px;
            background: linear-gradient(135deg, #34495e, #2c3e50);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .card-title {
            font-size: 1.3em;
            font-weight: 600;
            line-height: 1.3;
        }

        .card-tag {
            display: inline-block;
            font-size: 0.72em;
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 10px;
            border-radius: 20px;
            white-space: nowrap;
        }

        .card-body {
            padding: 20px 22px;
            flex: 1;
        }

        .card-description {
            color: #7f8c8d;
            margin-bottom: 15px;
            line-height: 1.6;
            font-size: 0.95em;
        }

        .card-files {
            margin-bottom: 15px;
        }

        .card-files label {
            display: block;
            font-size: 0.85em;
            color: #95a5a6;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .file-list {
            font-size: 0.82em;
            background: #f8f9fa;
            padding: 10px 12px;
            border-radius: 8px;
            max-height: 80px;
            overflow-y: auto;
            color: #7f8c8d;
        }

        .file-item {
            padding: 2px 0;
        }

        .card-footer {
            padding: 14px 22px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            background: #fafafa;
        }

        .btn {
            padding: 9px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: #34495e;
            color: white;
            flex: 1;
            justify-content: center;
        }

        .btn-primary:hover {
            background: #2c3e50;
            transform: scale(1.02);
        }

        .btn-secondary {
            background: #ecf0f1;
            color: #34495e;
        }

        .btn-secondary:hover {
            background: #dde1e3;
            transform: scale(1.02);
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #7f8c8d;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        }

        .empty-state-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .empty-state h2 {
            margin-bottom: 8px;
            color: #2c3e50;
        }

        .status-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.7em;
            font-weight: 600;
        }

        .status-completed {
            background: #4caf50;
            color: white;
        }

        .status-pending {
            background: #ff9800;
            color: white;
        }

        .status-in-progress {
            background: #2196f3;
            color: white;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            header {
                padding: 30px 16px;
            }

            header h1 {
                font-size: 2em;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .stats {
                flex-direction: column;
                align-items: stretch;
            }

            .stat-box {
                max-width: none;
            }
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
        }

        .modal-overlay.active {
            display: block;
        }

        .modal {
            background: white;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.2s ease;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 28px;
            border-bottom: 1px solid #eee;
            background: #fff;
            flex-shrink: 0;
        }

        .modal-header h2 {
            font-size: 1.15em;
            color: #2c3e50;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.6em;
            cursor: pointer;
            color: #95a5a6;
            padding: 4px 10px;
            border-radius: 8px;
            transition: all 0.2s;
            line-height: 1;
        }

        .modal-close:hover {
            background: #ecf0f1;
            color: #333;
        }

        .modal-body {
            padding: 32px 48px;
            overflow-y: auto;
            line-height: 1.8;
            font-size: 1em;
            color: #333;
            flex: 1;
            max-width: 1100px;
            margin: 0 auto;
            width: 100%;
        }

        .modal-body h1, .modal-body h2, .modal-body h3 {
            color: #2c3e50;
            margin-top: 1.2em;
            margin-bottom: 0.5em;
        }

        .modal-body h1 { font-size: 1.5em; }
        .modal-body h2 { font-size: 1.3em; }
        .modal-body h3 { font-size: 1.1em; }

        .modal-body p {
            margin-bottom: 0.8em;
        }

        .modal-body pre {
            background: #f5f7fa;
            padding: 14px 16px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 0.88em;
            margin: 0.8em 0;
            border: 1px solid #e8ecf0;
        }

        .modal-body code {
            background: #f0f2f5;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.9em;
        }

        .modal-body pre code {
            background: none;
            padding: 0;
        }

        .modal-body ul, .modal-body ol {
            padding-left: 1.5em;
            margin-bottom: 0.8em;
        }

        .modal-body strong {
            color: #2c3e50;
        }
            
        .code-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 2000;
            background: #1e1e1e;
            flex-direction: column;
        }
        .code-overlay.active { display: flex; }
        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: #252526;
            border-bottom: 1px solid #3c3c3c;
            flex-shrink: 0;
        }
        .code-filename { color: #ccc; font-size: 0.95em; font-weight: 500; }
        .code-header-actions { display: flex; align-items: center; gap: 12px; }
        .code-status { font-size: 0.8em; color: #888; }
        .code-close {
            background: none; border: none; color: #888; font-size: 1.4em;
            cursor: pointer; padding: 2px 8px; border-radius: 4px;
            transition: all 0.2s; line-height: 1;
        }
        .code-close:hover { background: #3c3c3c; color: #fff; }
        .code-panels { display: flex; flex: 1; overflow: hidden; }
        .code-panel { display: flex; flex-direction: column; overflow: hidden; }
        .code-panel-left { width: 60%; border-right: 1px solid #3c3c3c; }
        .code-panel-right { flex: 1; }
        .code-divider {
            width: 12px; cursor: col-resize; flex-shrink: 0;
            position: relative; z-index: 10;
            display: flex; align-items: center; justify-content: center;
        }
        .code-divider::before {
            content: ''; display: block;
            width: 4px; height: 40px; border-radius: 2px;
            background: #3c3c3c; transition: background 0.15s;
        }
        .code-divider:hover::before, .code-divider.dragging::before { background: #007acc; }
        .code-panel-label {
            padding: 8px 16px; font-size: 0.78em; color: #888;
            background: #2d2d2d; border-bottom: 1px solid #3c3c3c;
            flex-shrink: 0; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .code-content {
            flex: 1; margin: 0; padding: 16px 20px;
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
            font-size: 0.85em; line-height: 1.6; color: #d4d4d4;
            overflow: auto; white-space: pre; tab-size: 2;
        }
        .code-preview { flex: 1; border: none; background: white; }
        @media (max-width: 768px) {
            .code-panels { flex-direction: column; }
            .code-panel-left { border-right: none; border-bottom: 1px solid #3c3c3c; max-height: 50vh; }
        }
        .footer {
            text-align: center;
            color: #7f8c8d;
            margin-top: 50px;
            padding: 20px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>💻 ZN 作業統整平台</h1>
            <p>完整的課程作業展示與管理系統</p>
        </header>

        <div class="stats">
            <div class="stat-box">
                <h3 id="totalCount">8</h3>
                <p>總作業數</p>
            </div>
            <div class="stat-box">
                <h3 id="completedCount">8</h3>
                <p>已完成</p>
            </div>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 搜尋作業名稱、分類或技術...">
        </div>

        <div class="filter-tabs">
            <button class="filter-btn active" data-filter="all">全部</button>
            <button class="filter-btn" data-filter="javascript">JavaScript</button>
            <button class="filter-btn" data-filter="html">HTML/CSS</button>
            <button class="filter-btn" data-filter="fullstack">全棧</button>
            <button class="filter-btn" data-filter="other">其他</button>
        </div>

        <div class="grid" id="grid">
            <!-- 動態生成內容 -->
        </div>

        <div class="empty-state" id="emptyState" style="display: none;">
            <div class="empty-state-icon">🔍</div>
            <h2>找不到符合的作業</h2>
            <p>請嘗試其他搜尋條件</p>
        </div>

        <div class="modal-overlay" id="modalOverlay">
            <div class="modal">
                <div class="modal-header">
                    <h2 id="modalTitle">📖 README</h2>
                    <button class="modal-close" onclick="closeReadme()">✕</button>
                </div>
                <div class="modal-body" id="modalBody"></div>
            </div>
        </div>

        <div class="code-overlay" id="codeOverlay">
            <div class="code-header">
                <span class="code-filename" id="codeFilename">aboutme.html</span>
                <div class="code-header-actions">
                    <span class="code-status" id="codeStatus"></span>
                    <button class="code-close" onclick="closeCodeViewer()">✕</button>
                </div>
            </div>
            <div class="code-panels">
                <div class="code-panel code-panel-left" id="codePanelLeft">
                    <div class="code-panel-label">📄 原始碼</div>
                    <pre class="code-content" id="codeContent"><code></code></pre>
                </div>
                <div class="code-divider" id="codeDivider"></div>
                <div class="code-panel code-panel-right" id="previewPanel">
                    <div class="code-panel-label">🌐 預覽</div>
                    <iframe class="code-preview" id="codePreview" sandbox="allow-scripts allow-same-origin"></iframe>
                </div>
            </div>
        </div>
        <div class="footer">
            <p>📚 所有作業統整於此平台 | 最後更新 : 2026年5月29日</p>
        </div>
    </div>

    <script>
        const homeworks = [
            {
                id: 1,
                title: "01 - 關於我",
                category: "html",
                description: "個人簡介網頁，展示HTML基礎知識",
                tech: ["HTML5"],
                files: ["aboutme.html"],
                path: "./01/aboutme.html",
                codeFile: "./01/aboutme.html",
                status: "completed"
            },
            {
                id: 2,
                title: "02 - HTML基礎",
                category: "html",
                description: "HTML標籤和結構學習",
                tech: ["HTML5"],
                files: ["html"],
                path: "./02/html",
                codeFile: "./02/html",
                status: "completed"
            },
            {
                id: 3,
                title: "03 - JavaScript入門",
                category: "javascript",
                description: "JavaScript基本語法練習",
                tech: ["JavaScript"],
                files: ["hello.js", "README.md"],
                path: "./03/",
                codeFile: "./03/hello.js",
                status: "completed"
            },
            {
                id: 4,
                title: "04 - JavaScript習題集",
                category: "javascript",
                description: "10個評分習題，涵蓋JS基礎到進階",
                tech: ["JavaScript", "Node.js"],
                files: ["01-score.js", "02-score.js", ... "10-score.js"],
                path: "./04/",
                status: "completed",
                count: "10+ 習題",
                hasReadme: true
            },
            {
                id: 5,
                title: "06 - JavaScript進階",
                category: "javascript",
                description: "10個進階JavaScript習題",
                tech: ["JavaScript"],
                files: ["01.js", "02.js", ... "10.js"],
                path: "./06/",
                status: "completed",
                count: "10 習題"
            },
            {
                id: 6,
                title: "07 - JavaScript實踐",
                category: "javascript",
                description: "10個實踐應用習題",
                tech: ["JavaScript"],
                files: ["01.js", "02.js", ... "10.js"],
                path: "./07/",
                status: "completed",
                count: "10 習題"
            },
            {
                id: 7,
                title: "05 - 網頁設計 - 專題",
                category: "fullstack",
                description: "完整的網頁設計專題實踐",
                tech: ["HTML5", "CSS3", "JavaScript"],
                files: ["05-opencode/"],
                path: "./網頁設計/",
                status: "completed"
            },
            {
                id: 8,
                title: "Blog - 新聞聚合平台",
                category: "fullstack",
                description: "基於Node.js的英文新聞聚合平台，串接NewsAPI",
                tech: ["Node.js", "Express.js", "Axios", "HTML5", "CSS3"],
                files: ["server.js", "package.json", "public/"],
                path: "./Blog/",
                status: "completed",
                link: "Node.js 伺服器應用",
                hasReadme: true
            }
        ];

        let filteredHomeworks = [...homeworks];

        const grid = document.getElementById('grid');
        const searchInput = document.getElementById('searchInput');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const emptyState = document.getElementById('emptyState');

        function renderCards(data) {
            grid.innerHTML = '';
            
            if (data.length === 0) {
                grid.style.display = 'none';
                emptyState.style.display = 'block';
                return;
            }
            
            grid.style.display = 'grid';
            emptyState.style.display = 'none';

            data.forEach(hw => {
                const card = document.createElement('div');
                card.className = 'card';
                
                const statusClass = `status-${hw.status}`;
                const statusText = {
                    'completed': '✅ 已完成',
                    'in-progress': '⏳ 進行中',
                    'pending': '⏱️ 待完成'
                }[hw.status];

                const filesHtml = hw.files.length > 3 
                    ? hw.files.slice(0, 3).join(', ') + `, ...等 ${hw.files.length} 項`
                    : hw.files.join(', ');

                card.innerHTML = `
                    <div class="card-header">
                        <div>
                            <div class="card-title">${hw.title}</div>
                            <span class="card-tag">${hw.category}</span>
                        </div>
                    </div>
                    <div class="card-body">
                        <p class="card-description">${hw.description}</p>
                        <div class="card-files">
                            <label>📁 檔案</label>
                            <div class="file-list">
                                <div class="file-item">${filesHtml}</div>
                            </div>
                        </div>
                        <div>
                            <strong>⚙️ 技術棧</strong><br>
                            ${hw.tech.map(t => `<span class="card-tag">${t}</span>`).join('')}
                        </div>
                    </div>
                    <div class="card-footer">
                        ${hw.codeFile
                            ? `<button class="btn btn-primary code-btn" data-file="${hw.codeFile}" data-title="${hw.title}">📂 檢視程式碼</button>`
                            : `<a href="${hw.path}" class="btn btn-primary">📂 檢視程式碼</a>`
                        }
                        ${hw.hasReadme ? `<button class="btn btn-secondary readme-btn" data-path="${hw.path}">📖 README</button>` : ''}
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // 搜尋功能
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            filteredHomeworks = homeworks.filter(hw => 
                hw.title.toLowerCase().includes(query) ||
                hw.description.toLowerCase().includes(query) ||
                hw.tech.some(t => t.toLowerCase().includes(query)) ||
                hw.category.toLowerCase().includes(query)
            );
            renderCards(filteredHomeworks);
        });

        // 分類過濾功能
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                const filter = btn.dataset.filter;
                if (filter === 'all') {
                    filteredHomeworks = [...homeworks];
                } else {
                    filteredHomeworks = homeworks.filter(hw => hw.category === filter);
                }
                renderCards(filteredHomeworks);
            });
        });

        // README 功能
        document.addEventListener('click', (e) => {
            const btn = e.target.closest('.readme-btn');
            if (btn) openReadme(btn.dataset.path);
        });

        function openReadme(path) {
            const overlay = document.getElementById('modalOverlay');
            const title = document.getElementById('modalTitle');
            const body = document.getElementById('modalBody');
            title.textContent = '📖 載入中...';
            body.innerHTML = '<p style="text-align:center;color:#95a5a6;">讀取 README 中...</p>';
            overlay.classList.add('active');

            fetch(`${path}README.md`)
                .then(res => {
                    if (!res.ok) throw new Error('無 README');
                    return res.text();
                })
                .then(text => {
                    title.textContent = '📖 README';
                    body.innerHTML = renderMarkdown(text);
                })
                .catch(() => {
                    title.textContent = '📖 README';
                    body.innerHTML = '<p style="text-align:center;color:#95a5a6;">此作業沒有 README</p>';
                });
        }

        function closeReadme() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeReadme();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeReadme();
        });

        function renderMarkdown(text) {
            return text
                .replace(/^### (.+)$/gm, '<h3>$1</h3>')
                .replace(/^## (.+)$/gm, '<h2>$1</h2>')
                .replace(/^# (.+)$/gm, '<h1>$1</h1>')
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                .replace(/^\- (.+)$/gm, '<li>$1</li>')
                .replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>')
                .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/\n\n/g, '</p><p>')
                .replace(/\n/g, '<br>');
        }

        // 程式碼檢視器
        document.addEventListener('click', (e) => {
            const btn = e.target.closest('.code-btn');
            if (btn) openCodeViewer(btn.dataset.file, btn.dataset.title);
        });

        function highlightCode(code, lang) {
            const escape = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
            let html = escape(code);

            if (lang === 'html') {
                html = html
                    .replace(/(&lt;!--[\s\S]*?--&gt;)/g, '<span style="color:#6a9955">$1</span>')
                    .replace(/(&lt;\/?)([\w-]+)/g, '$1<span style="color:#569cd6">$2</span>')
                    .replace(/(\b(class|id|src|href|style|rel|type|name|action|method|target|alt|width|height)\s*=\s*)(&quot;|&#39;|&quot;)/gi, (m, attr, q) => {
                        return attr.replace(/=/, '=<span style="color:#9cdcfe">') + q;
                    })
                    .replace(/(&quot;[^&]*&quot;|&#39;[^&#]*&#39;)/g, '<span style="color:#ce9178">$1</span>');
            } else if (lang === 'js') {
                const keywords = /\b(async|await|break|case|catch|const|continue|default|delete|do|else|export|extends|false|finally|for|function|if|import|in|instanceof|let|new|null|of|return|static|switch|this|throw|true|try|typeof|var|void|while|with|yield)\b/g;
                html = html
                    .replace(/(\/\/.*)/g, '<span style="color:#6a9955">$1</span>')
                    .replace(/(\/\*[\s\S]*?\*\/)/g, '<span style="color:#6a9955">$1</span>')
                    .replace(keywords, '<span style="color:#569cd6">$1</span>')
                    .replace(/("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'|`(?:[^`\\]|\\.)*`)/g, '<span style="color:#ce9178">$1</span>')
                    .replace(/\b(\d+\.?\d*)\b/g, '<span style="color:#b5cea8">$1</span>')
                    .replace(/(\/\/.*)/g, (m) => m);
            }

            return html;
        }

        function openCodeViewer(file, title) {
            const overlay = document.getElementById('codeOverlay');
            const filename = document.getElementById('codeFilename');
            const content = document.getElementById('codeContent');
            const preview = document.getElementById('codePreview');
            const status = document.getElementById('codeStatus');
            const previewPanel = document.getElementById('previewPanel');

            filename.textContent = file.split('/').pop();
            content.innerHTML = '';
            status.textContent = '';
            preview.src = '';
            overlay.classList.add('active');

            const isHtml = file.match(/\.html?$/i) || file.match(/\/html$/i);
            const isJs = file.match(/\.js$/i);

            const divider = document.getElementById('codeDivider');
            if (!isHtml) {
                previewPanel.style.display = 'none';
                divider.style.display = 'none';
            } else {
                previewPanel.style.display = 'flex';
                divider.style.display = '';
                preview.src = file;
                status.textContent = '✓ 預覽就緒';
            }

            fetch(file)
                .then(res => {
                    if (!res.ok) throw new Error('無法讀取檔案');
                    return res.text();
                })
                .then(text => {
                    const lang = isHtml ? 'html' : isJs ? 'js' : '';
                    content.innerHTML = highlightCode(text, lang);
                })
                .catch(() => {
                    content.innerHTML = '<span style="color:#f44747">// 無法讀取檔案內容</span>';
                });
        }

        function closeCodeViewer() {
            document.getElementById('codeOverlay').classList.remove('active');
            document.getElementById('codePreview').src = '';
            document.getElementById('codePanelLeft').style.width = '';
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeCodeViewer();
        });

        // 分割線拖曳
        (function() {
            const divider = document.getElementById('codeDivider');
            const left = document.getElementById('codePanelLeft');
            const overlay = document.getElementById('codeOverlay');
            if (!divider) return;

            let dragging = false;

            function startDrag() {
                dragging = true;
                divider.classList.add('dragging');
                overlay.style.cursor = 'col-resize';
            }

            function moveDrag(clientX) {
                if (!dragging) return;
                const panels = divider.parentElement;
                const rect = panels.getBoundingClientRect();
                let pct = ((clientX - rect.left) / rect.width) * 100;
                pct = Math.max(20, Math.min(80, pct));
                left.style.width = pct + '%';
            }

            function endDrag() {
                if (dragging) {
                    dragging = false;
                    divider.classList.remove('dragging');
                    overlay.style.cursor = '';
                }
            }

            divider.addEventListener('mousedown', startDrag);
            document.addEventListener('mousemove', e => moveDrag(e.clientX));
            document.addEventListener('mouseup', endDrag);

            divider.addEventListener('touchstart', e => { startDrag(); e.preventDefault(); });
            document.addEventListener('touchmove', e => moveDrag(e.touches[0].clientX), { passive: true });
            document.addEventListener('touchend', endDrag);
        })();

        // 初始化
        renderCards(homeworks);
    </script>
</body>
</html>
